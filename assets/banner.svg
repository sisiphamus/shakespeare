<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title">
  <title id="title">Shakespeare</title>
  <rect width="1280" height="420" fill="#09090b"/>
  <!-- single hard accent mark -->
  <rect x="96" y="168" width="6" height="96" fill="#e11d48"/>
  <text x="128" y="220"
        font-family="ui-serif, Georgia, 'Times New Roman', serif"
        font-size="92"
        font-weight="600"
        letter-spacing="-0.03em"
        fill="#fafafa">Shakespeare</text>
  <text x="132" y="268"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="22"
        font-weight="400"
        letter-spacing="-0.01em"
        fill="#a1a1aa">Write like a person. Or like you.</text>
</svg>
