<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title">
  <title id="title">Shakespeare</title>
  <rect width="1280" height="400" fill="#0c0c0c"/>
  <rect x="40" y="36" width="1200" height="328" fill="#0c0c0c" stroke="#3f3f46" stroke-width="1"/>
  <!-- title bar dots like a terminal chrome, muted -->
  <circle cx="64" cy="60" r="5" fill="#3f3f46"/>
  <circle cx="84" cy="60" r="5" fill="#3f3f46"/>
  <circle cx="104" cy="60" r="5" fill="#3f3f46"/>
  <text x="128" y="65"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="14" fill="#71717a">shakespeare — skill</text>

  <!-- TUI block: word + book -->
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="28" fill="#e4e4e7" xml:space="preserve">
    <tspan x="80" y="150">SHAKESPEARE          ________</tspan>
    <tspan x="80" y="186">                      /       /|</tspan>
    <tspan x="80" y="222">write like a person  /_______/ |</tspan>
    <tspan x="80" y="258">or like you          |       | /</tspan>
    <tspan x="80" y="294">                    |_______|/</tspan>
  </text>
</svg>
